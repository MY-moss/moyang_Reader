name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本，必须与 package.json/Cargo.toml 一致，例如 0.5.3"
        required: true
        type: string

permissions:
  contents: write
  checks: write

jobs:
  publish:
    name: Build and publish Windows update
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    runs-on: windows-latest
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Verify pinned GitHub Actions
        run: node scripts/check-action-pins.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Rust dependency audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $rawVersion = if ($env:EVENT_NAME -eq "workflow_dispatch") { $env:INPUT_VERSION } else { $env:REF_NAME }
          if ([string]::IsNullOrWhiteSpace($rawVersion)) {
            throw "无法确定发布版本。"
          }
          $tag = if ($rawVersion.StartsWith("v", [System.StringComparison]::OrdinalIgnoreCase)) { $rawVersion } else { "v$rawVersion" }
          npm run release:check -- --version=$tag
          if ($LASTEXITCODE -ne 0) {
            throw "发布版本未通过版本一致性检查。"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Quality gate
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          npm run lint
          npm run format:check
          npm run test:coverage
          npm run build
          npx playwright install chromium
          npm run test:e2e
          # Test/build tooling is not included in the installer; audit shipped
          # runtime dependencies here and track dev-tool advisories separately.
          npm audit --omit=dev --audit-level=high
          npm run release:check -- --version=$env:RELEASE_TAG
          npm run test:release
          npm run rust -- fmt --manifest-path src-tauri/Cargo.toml -- --check
          npm run rust -- clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          npm run rust -- test --manifest-path src-tauri/Cargo.toml

      - name: Build signed installer and publish release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: Moyang Reader ${{ steps.release.outputs.tag }}
          releaseBody: |
            Moyang Reader ${{ steps.release.outputs.tag }}：快速打开本地 Markdown、文本和常见附件。
            已安装的 Moyang Reader 会通过签名更新包检测并提示升级。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json

  mirror:
    name: Publish updater mirror
    needs: publish
    if: needs.publish.result == 'success'
    uses: ./.github/workflows/mirror-release.yml
    with:
      version: ${{ needs.publish.outputs.release_tag }}
    secrets: inherit
