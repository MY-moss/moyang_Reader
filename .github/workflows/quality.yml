name: Moyang Reader quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-next-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality checks
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.reader-next-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> .reader-next-target
            src-tauri -> ../.reader-next-target
          cache-on-failure: true
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:ai
      - run: npm run rust -- test --manifest-path src-tauri/Cargo.toml --lib
      - run: npx playwright install chromium
      - run: npm run test:e2e
      # Sequential: both browser and desktop builds write the same dist directory.
      - run: npm run test:e2e:desktop
      - run: powershell.exe -NoProfile -File scripts/test-update-activation.ps1
      - run: node scripts/test-storage-migration.mjs
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reader-next-failure-evidence
          path: |
            artifacts/desktop-failures/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
