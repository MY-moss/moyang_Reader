name: Reader Next quality

on:
  pull_request:
    paths:
      - "moyang-reader-next/**"
      - ".github/workflows/reader-next.yml"
  push:
    branches: [main]
    paths:
      - "moyang-reader-next/**"
      - ".github/workflows/reader-next.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-next-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Reader Next checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: moyang-reader-next
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: moyang-reader-next/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:ai
      - run: npm run rust -- test --manifest-path src-tauri/Cargo.toml --lib
      - run: npx playwright install chromium
      - run: npm run test:e2e
      # Sequential: both browser and desktop builds write the same dist directory.
      - run: npm run test:e2e:desktop
