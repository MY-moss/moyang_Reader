name: Reader Next quality

on:
  pull_request:
    paths:
      - "moyang-reader-next/**"
      - ".github/workflows/reader-next.yml"
  push:
    branches: [main]
    paths:
      - "moyang-reader-next/**"
      - ".github/workflows/reader-next.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-next-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Reader Next checks
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.reader-next-target
    defaults:
      run:
        working-directory: moyang-reader-next
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: moyang-reader-next/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: moyang-reader-next -> ../.reader-next-target
          cache-on-failure: true
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:ai
      - run: npm run rust -- test --manifest-path src-tauri/Cargo.toml --lib
      - run: npx playwright install chromium
      - run: npm run test:e2e
      # Sequential: both browser and desktop builds write the same dist directory.
      - run: npm run test:e2e:desktop
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reader-next-failure-evidence
          path: |
            moyang-reader-next/artifacts/desktop-failures/
            moyang-reader-next/test-results/
          if-no-files-found: ignore
          retention-days: 7
