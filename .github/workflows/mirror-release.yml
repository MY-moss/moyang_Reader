name: Mirror release to Cloudflare Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "要同步的 Release 标签，必须包含 v，例如 v0.9.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mirror-release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: true

jobs:
  mirror:
    name: Publish updater mirror
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
      MIRROR_BASE_URL: https://moyang-reader-mirror.pages.dev
      MIRROR_PROJECT: moyang-reader-mirror
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate release tag
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG.Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "镜像同步版本必须是带 v 前缀的 SemVer：$tag"
          }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Require Cloudflare credentials
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) {
            throw "缺少 CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID；正式 Release 不允许跳过镜像上传。"
          }

      - name: Download public release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetDir = Join-Path $env:RUNNER_TEMP "moyang-reader-release-assets"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $assetDir
          if ($LASTEXITCODE -ne 0) {
            throw "无法下载 Release 资产：$env:RELEASE_TAG"
          }
          $manifestPath = Join-Path $assetDir "latest.json"
          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw "Release 缺少 latest.json。"
          }
          node scripts/release-check.mjs --version=$env:RELEASE_TAG --manifest="$manifestPath"
          if ($LASTEXITCODE -ne 0) {
            throw "Release 资产未通过 manifest 校验。"
          }
          "ASSET_DIR=$assetDir" >> $env:GITHUB_ENV

      - name: Prepare mirror files
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP "moyang-reader-mirror"
          node scripts/prepare-mirror.mjs --manifest="$env:ASSET_DIR/latest.json" --asset-dir="$env:ASSET_DIR" --output="$outputDir" --base-url="$env:MIRROR_BASE_URL" --version="$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "无法生成 Cloudflare 静态镜像目录。"
          }

      - name: Deploy Cloudflare Pages mirror
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy "${{ runner.temp }}/moyang-reader-mirror" --project-name=${{ env.MIRROR_PROJECT }} --branch=main

      - name: Verify published updater mirror
        shell: pwsh
        run: |
          $expectedVersion = $env:RELEASE_TAG.TrimStart("v")
          $baseUrl = $env:MIRROR_BASE_URL.TrimEnd("/")

          function Get-MirrorManifest([string]$url) {
            $lastError = $null
            for ($attempt = 1; $attempt -le 12; $attempt++) {
              try {
                $result = Invoke-RestMethod -Headers @{ "Cache-Control" = "no-cache" } -Uri "$url&attempt=$attempt" -TimeoutSec 20
                if ([string]$result.version -ne $expectedVersion) {
                  throw "镜像仍返回旧版本 $($result.version)。"
                }
                return $result
              } catch {
                $lastError = $_
                if ($attempt -lt 12) {
                  Start-Sleep -Seconds 5
                }
              }
            }
            throw "镜像 manifest 在重试后仍不可用：$url；$lastError"
          }

          function Assert-MirrorAsset([string]$url, [int64]$expectedLength = 0) {
            $lastError = $null
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                $response = Invoke-WebRequest -Method Head -Headers @{ "Cache-Control" = "no-cache" } -Uri $url -TimeoutSec 20
                if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
                  throw "HTTP $($response.StatusCode)"
                }
                $contentLength = $response.Headers["Content-Length"]
                if ($expectedLength -gt 0 -and $contentLength -and [int64]$contentLength -ne $expectedLength) {
                  throw "文件大小 $contentLength 与 Release 大小 $expectedLength 不一致"
                }
                return
              } catch {
                $lastError = $_
                if ($attempt -lt 3) {
                  Start-Sleep -Seconds 3
                }
              }
            }
            throw "镜像资产不可访问：$url；$lastError"
          }

          $manifest = Get-MirrorManifest "$baseUrl/latest.json?version=$expectedVersion"
          $null = Get-MirrorManifest "$baseUrl/v$expectedVersion/latest.json?version=$expectedVersion"
          $checkedUrls = [System.Collections.Generic.HashSet[string]]::new()
          foreach ($entry in $manifest.platforms.PSObject.Properties) {
            $platform = $entry.Value
            if ($null -eq $platform -or [string]::IsNullOrWhiteSpace($platform.url)) {
              throw "$($entry.Name) 缺少镜像下载地址。"
            }
            if ($platform.url -notmatch "/v$expectedVersion/") {
              throw "$($entry.Name) 未指向当前镜像版本：$($platform.url)"
            }
            if (-not $checkedUrls.Add($platform.url)) {
              continue
            }
            $uri = [System.Uri]$platform.url
            $assetName = [System.IO.Path]::GetFileName([System.Uri]::UnescapeDataString($uri.AbsolutePath))
            $assetPath = Join-Path $env:ASSET_DIR $assetName
            if (-not (Test-Path -LiteralPath $assetPath)) {
              throw "本地 Release 缓存缺少镜像资产：$assetName"
            }
            $assetLength = (Get-Item -LiteralPath $assetPath).Length
            Assert-MirrorAsset $platform.url $assetLength
            Assert-MirrorAsset "$($platform.url).sig"
          }
          Write-Host "Updater mirror verified for v$expectedVersion"
