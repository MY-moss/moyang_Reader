name: Mirror release to Cloudflare Pages

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "要同步的 Release 标签，例如 v0.6.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  mirror:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Publish updater mirror
    runs-on: windows-latest
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version || github.event.workflow_run.head_branch }}
      MIRROR_BASE_URL: https://moyang-reader-mirror.pages.dev
      MIRROR_PROJECT: moyang-reader-mirror
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.version || github.event.workflow_run.head_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) {
            Write-Warning "未配置 Cloudflare Secrets，将验证现有轻量镜像代理，不执行重复资产上传。"
            "CLOUDFLARE_DEPLOY_ENABLED=false" >> $env:GITHUB_ENV
          } else {
            "CLOUDFLARE_DEPLOY_ENABLED=true" >> $env:GITHUB_ENV
          }

      - name: Download public release assets
        if: ${{ env.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetDir = Join-Path $env:RUNNER_TEMP "moyang-reader-release-assets"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern "latest.json" --dir $assetDir
          $assetNames = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) {
            throw "无法读取 Release 资产列表。"
          }
          foreach ($assetName in ($assetNames | Where-Object { $_ -ne "latest.json" -and $_ -notlike "*.sig" })) {
            gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $assetName --pattern "$assetName.sig" --dir $assetDir
          }
          $manifestPath = Join-Path $assetDir "latest.json"
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          $releaseAssets = (gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json).assets
          foreach ($entry in $manifest.platforms.PSObject.Properties) {
            $asset = $releaseAssets | Where-Object { $_.apiUrl -eq $entry.Value.url } | Select-Object -First 1
            if ($null -eq $asset) {
              throw "无法将更新清单映射到 Release 资产：$($entry.Name)"
            }
            $entry.Value.url = $asset.url
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 -LiteralPath $manifestPath
          "ASSET_DIR=$assetDir" >> $env:GITHUB_ENV

      - name: Prepare mirror files
        if: ${{ env.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP "moyang-reader-mirror"
          node scripts/prepare-mirror.mjs --manifest="$env:ASSET_DIR/latest.json" --asset-dir="$env:ASSET_DIR" --output="$outputDir" --base-url="$env:MIRROR_BASE_URL" --version="$env:RELEASE_TAG"
          "MIRROR_DIR=$outputDir" >> $env:GITHUB_ENV

      - name: Deploy Cloudflare Pages mirror
        if: ${{ env.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy "${{ runner.temp }}/moyang-reader-mirror" --project-name=${{ env.MIRROR_PROJECT }}

      - name: Verify published updater mirror
        shell: pwsh
        run: |
          $manifest = Invoke-RestMethod -Uri "$env:MIRROR_BASE_URL/latest.json"
          $expectedVersion = $env:RELEASE_TAG.TrimStart("v")
          if ([string]$manifest.version -ne $expectedVersion) {
            throw "镜像版本 $($manifest.version) 与发布版本 $expectedVersion 不一致。"
          }
          $platform = $manifest.platforms.'windows-x86_64'
          if ($null -eq $platform -or [string]::IsNullOrWhiteSpace($platform.signature)) {
            throw "镜像 latest.json 缺少 Windows 更新签名。"
          }
          $response = Invoke-WebRequest -Method Head -Uri $platform.url
          if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
            throw "镜像安装包不可访问：HTTP $($response.StatusCode)"
          }
          Write-Host "Updater mirror verified for v$expectedVersion"
