name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  quality:
    name: Quality checks
    # First-party feature branches run once from the push event so the
    # required check is attached directly to the PR head SHA. Forks continue
    # to use pull_request, which avoids granting write access to untrusted code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Configuration format check
        run: npm run format:check

      - name: Frontend coverage gate
        run: npm run test:coverage

      - name: Frontend build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Browser smoke test
        run: npm run test:e2e

      - name: Desktop smoke test
        run: npm run test:e2e:desktop

      - name: Dependency audit
        # Only production dependencies ship in the application; desktop/browser
        # runners remain covered by Dependabot and local test execution.
        run: npm audit --omit=dev --audit-level=high

      - name: Release metadata check
        run: npm run release:check

      - name: Release preflight tests
        run: npm run test:release

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
