name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keep manual validation independent from the required push check for the
  # same commit. Push runs still cancel older push runs on the same branch.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  quality:
    name: Quality checks
    # Feature branches use the pull_request event as their single validation
    # path. This also covers commits created through the GitHub API, which do
    # not always emit a push event; main remains covered by the push trigger.
    runs-on: windows-latest
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Verify pinned GitHub Actions
        run: node scripts/check-action-pins.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05

      - name: Verify Rust minimum version
        shell: pwsh
        run: |
          $manifest = Get-Content src-tauri/Cargo.toml -Raw
          $minimum = [regex]::Match($manifest, '(?m)^rust-version\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $minimum) {
            throw "src-tauri/Cargo.toml must declare rust-version"
          }
          Write-Host "Rust toolchain: $(rustc --version)"
          Write-Host "Manifest minimum Rust version: $minimum"
          npm run rust -- metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps --format-version 1 --filter-platform x86_64-pc-windows-msvc | Out-Null

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Type-aware ESLint probe
        run: npm run check:type-aware

      - name: Configuration format check
        run: npm run format:check

      - name: Workspace hygiene helper tests
        run: npm run test:workflow

      - name: Frontend coverage gate
        run: npm run test:coverage

      - name: Frontend build
        run: npm run build

      - name: Check build artifacts
        run: npm run check:build-artifacts

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Browser and accessibility smoke test
        run: npm run test:e2e

      - name: Desktop smoke test
        run: npm run test:e2e:desktop

      - name: Dependency audit
        # Only production dependencies ship in the application; desktop/browser
        # runners remain covered by Dependabot and local test execution.
        run: npm audit --omit=dev --audit-level=high

      - name: Release metadata check
        run: npm run release:check

      - name: Release and handoff status check
        run: npm run release:status

      - name: Release preflight tests
        run: npm run test:release

      - name: Rust format
        run: npm run rust -- fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: npm run rust -- clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: npm run rust -- test --manifest-path src-tauri/Cargo.toml
