name: Desktop benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

concurrency:
  group: desktop-benchmark-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    name: Windows desktop performance benchmark
    runs-on: windows-latest
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run desktop performance benchmark
        run: npm run test:e2e:desktop:benchmark
