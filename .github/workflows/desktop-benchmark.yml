name: Desktop benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

concurrency:
  group: desktop-benchmark-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    name: Windows desktop performance benchmark
    runs-on: windows-latest
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      MOYANG_WORKSPACE_BENCHMARK_REPORT: artifacts/workspace-benchmark.json
      MOYANG_WORKSPACE_BENCHMARK_SIZES: 5000,20000
      MOYANG_WORKSPACE_BENCHMARK_ROUNDS: 3
      MOYANG_WORKSPACE_BENCHMARK_WARM_SAMPLES: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run large workspace performance benchmark
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          npm run rust -- test --manifest-path src-tauri/Cargo.toml --lib benchmarks_large_workspaces -- --ignored --nocapture

      - name: Run large document desktop benchmark
        run: npm run test:e2e:desktop:large-document

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workspace-benchmark-report
          path: artifacts/workspace-benchmark.json
          if-no-files-found: error

      - name: Upload large document benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: large-document-benchmark-report
          path: artifacts/large-document-benchmark.json
          if-no-files-found: warn
