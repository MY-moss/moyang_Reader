[package]
name = "moyang-reader"
version = "0.9.3"
description = "A fast local document reader"
authors = ["Moyang"]
edition = "2021"

[lib]
name = "moyang_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
encoding_rs = "0.8"
notify = { version = "8", features = ["serde", "serialization-compat-6"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dependencies.tauri-plugin-wdio-webdriver]
version = "1.3"
optional = true

[dependencies.tauri-plugin-wdio]
version = "1.3"
optional = true
