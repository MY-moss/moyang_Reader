[package]
name = "moyang-ai-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
moyang-ai-core = { path = "../ai-core" }
rmcp = { version = "=3.5.1", features = ["transport-io", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
rmcp = { version = "=3.5.1", features = ["client", "transport-child-process"] }
